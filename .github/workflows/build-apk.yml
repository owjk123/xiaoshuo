name: Build APK

on:
  push:
    branches:
      - main
      - claude/android-ai-integration-Cd7dU
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --channel=0 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee /tmp/build-debug.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Print build log (last 200 lines)
        if: always()
        run: |
          if [ -f /tmp/build-debug.log ]; then
            echo "=== ERROR LINES ==="
            grep -iE "error:|exception:|: error|FAILED" /tmp/build-debug.log | head -50 || echo "(none)"
            echo "=== LAST 200 LINES ==="
            tail -200 /tmp/build-debug.log
          else
            echo "No build log found"
          fi

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: /tmp/build-debug.log
          retention-days: 3

      - name: Fail if build failed
        if: steps.build_debug.outputs.exit_code != '0'
        run: exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --stacktrace

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Show build outputs
        if: always()
        run: |
          echo "=== Debug APK ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "not found"
          echo "=== Release APK ==="
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "not found"
