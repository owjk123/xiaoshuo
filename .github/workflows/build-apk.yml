name: Build APK

on:
  push:
    branches:
      - main
      - claude/android-ai-integration-Cd7dU
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --channel=0 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug + Release APK
        id: build
        continue-on-error: true
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --info 2>&1 | tee /tmp/build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "exit_code=$BUILD_EXIT" >> $GITHUB_OUTPUT
          exit $BUILD_EXIT

      - name: Upload build log as Gist
        if: always()
        run: |
          LOG=$(tail -400 /tmp/build.log 2>/dev/null | head -c 55000 | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          RESPONSE=$(curl -s -X POST https://api.github.com/gists \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"description\":\"CI Build Log Run ${{ github.run_number }}\",\"public\":false,\"files\":{\"build.log\":{\"content\":$LOG}}}")
          echo "Gist URL: $(echo $RESPONSE | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r.get(\"html_url\",\"error\"))')"
          echo "Gist ID: $(echo $RESPONSE | python3 -c 'import sys,json; r=json.load(sys.stdin); print(r.get(\"id\",\"error\"))')"

      - name: Show APK check
        if: always()
        run: |
          echo "=== APK files ==="
          find . -name "*.apk" 2>/dev/null | head -20 || echo "None"
          echo "=== Debug ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "not found"
          echo "=== Release ==="
          ls -lh app/build/outputs/apk/release/ 2>/dev/null || echo "not found"

      - name: Fail if build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
