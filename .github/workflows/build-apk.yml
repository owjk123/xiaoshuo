name: Build APK

on:
  push:
    branches:
      - main
      - claude/android-ai-integration-Cd7dU
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build-tools
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            --channel=0 || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Created local.properties:"
          cat local.properties

      - name: Build Debug APK
        id: build_debug
        continue-on-error: true
        run: gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; echo "BUILD_EXIT=${PIPESTATUS[0]}" | tee -a /tmp/build.log

      - name: Upload log to GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Run: ${{ github.run_number }} | Commit: ${{ github.sha }}"
            echo ""
            echo "=== LAST 300 LINES OF BUILD LOG ==="
            echo ""
            tail -300 /tmp/build.log 2>/dev/null || echo "(no log)"
          } > /tmp/issue_body.txt
          gh issue create \
            --repo owjk123/xiaoshuo \
            --title "CI Build Log #${{ github.run_number }}" \
            --body-file /tmp/issue_body.txt \
            && echo "Issue created" || echo "Issue creation failed"

      - name: Fail if build failed
        run: |
          grep -q "BUILD_EXIT=0" /tmp/build.log && echo "Build succeeded" || { echo "Build failed"; exit 1; }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Release APK (unsigned)
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuo-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
